name: Deploy to server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Set these two repository secrets once the site is behind Cloudflare.
      # Until then they are empty and the purge step is skipped.
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            docker compose build
            docker compose up -d
            docker image prune -f

      # Static pages are served with `s-maxage=31536000`, so Cloudflare keeps
      # them at the edge for a year. After every deploy the cache is purged so
      # visitors get the new pages straight away, then the main pages are
      # fetched once so the first real visitor gets a cached copy.
      - name: Purge Cloudflare cache
        if: env.CF_ZONE_ID != '' && env.CF_API_TOKEN != ''
        run: |
          set -e
          sleep 20   # let the new container finish starting
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' > /dev/null
          echo "Cloudflare cache purged"
          for path in / /services /areas /contact /blog /sitemap.xml /llms.txt; do
            curl -s -o /dev/null -w "warm %{http_code} ${path}\n" "https://advkrupalsavjani.in${path}" || true
          done
